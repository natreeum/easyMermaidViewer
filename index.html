<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Mermaid Viewer</title>
  <style>
    @property --grid {
      syntax: "<color>";
      inherits: true;
      initial-value: #e1e5ec;
    }
    :root {
      color-scheme: light;
      --theme-duration: 300ms;
      --theme-transition: background-color var(--theme-duration) ease, color var(--theme-duration) ease,
        border-color var(--theme-duration) ease, box-shadow var(--theme-duration) ease, outline-color var(--theme-duration) ease;
      transition: --grid var(--theme-duration) ease;
      --page-bg: #f5f6f8;
      --surface: #fff;
      --text: #20242c;
      --editor-text: #252b36;
      --border: #d9dde5;
      --muted: #667085;
      --empty-text: #88909f;
      --grid: #e1e5ec;
      --hint-bg: #fffffff0;
      --error: #b42318;
      --focus: #6366f1;
      --active-bg: #eef2ff;
      --active-border: #c7d2fe;
      --active-text: #4338ca;
      --shadow: #20242c14;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --page-bg: #111827;
      --surface: #1b2432;
      --text: #e5e7eb;
      --editor-text: #e2e8f0;
      --border: #374151;
      --muted: #a5b0c0;
      --empty-text: #94a3b8;
      --grid: #334155;
      --hint-bg: #1b2432f0;
      --error: #fda29b;
      --focus: #818cf8;
      --active-bg: #292b4b;
      --active-border: #4b4a88;
      --active-text: #c7d2fe;
      --shadow: #00000040;
    }
    * { box-sizing: border-box; }
    :where(body, button, textarea, .code-tab-panel, .code-tab-name-input, .code-tab-menu, .preview,
      .participant-header, .empty, .hint, .hint span, #status, #storage-status) {
      transition: var(--theme-transition);
    }
    .code-tab-name-input::placeholder { transition: color var(--theme-duration) ease; }
    body {
      margin: 0;
      color: var(--text);
      background: var(--page-bg);
      font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      display: grid;
      grid-template-columns: clamp(280px, var(--editor-width, 34%), calc(100% - 296px)) minmax(280px, 1fr);
      gap: 16px;
      height: 100dvh;
      padding: 20px;
    }
    .editor { display: flex; flex-direction: column; gap: 12px; min-width: 0; min-height: 0; }
    .editor[hidden] { display: none; }
    .editor-header { position: relative; z-index: 3; display: flex; align-items: center; gap: 10px; padding-top: 24px; }
    .editor-header [data-tooltip] { position: relative; }
    .editor-header [data-tooltip]::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      z-index: 10;
      transform: translateX(-50%);
      padding: 6px 9px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--text);
      color: var(--surface);
      box-shadow: 0 2px 8px var(--shadow);
      font-size: 12px;
      font-weight: 500;
      line-height: 1.4;
      white-space: nowrap;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 150ms ease, visibility 0s linear 150ms, var(--theme-transition);
    }
    .editor-header [data-tooltip]:not(:disabled):not([aria-expanded="true"]):is(:hover, :focus-visible)::after {
      opacity: 1;
      visibility: visible;
      transition-delay: 0s;
    }
    .editor-header [data-tooltip-align="end"]::after { left: auto; right: 0; transform: none; }
    .code-tab-picker { display: flex; }
    .code-tab-trigger, .rename-tab, .backup-button, .format-code {
      display: grid;
      place-items: center;
      flex: none;
      width: 28px;
      height: 28px;
      padding: 0;
    }
    .code-tab-popover {
      position: absolute;
      top: 100%;
      left: 0;
      z-index: 5;
      width: min(320px, 100%);
      padding-top: 6px;
    }
    .code-tab-menu {
      display: grid;
      gap: 4px;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 4px 16px var(--shadow);
    }
    .code-tabs { display: grid; gap: 4px; }
    .code-tabs-page {
      display: grid;
      place-items: center;
      width: 100%;
      height: 24px;
      padding: 0;
      border-color: transparent;
    }
    .code-tabs-page:disabled { opacity: .3; cursor: default; filter: none; }
    .code-tab-row { display: grid; grid-template-columns: minmax(0, 1fr) 28px; align-items: center; gap: 4px; }
    .code-tab {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      height: 36px;
      padding: 5px 8px;
      text-align: left;
      border-color: transparent;
    }
    .code-tab-number { flex: none; width: 20px; text-align: center; font-size: 12px; }
    .code-tab-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .code-tab[aria-selected="true"] { border-color: var(--active-border); background: var(--active-bg); color: var(--active-text); }
    .code-tab-name-input {
      grid-column: 1 / -1;
      min-width: 0;
      width: 100%;
      height: 36px;
      padding: 5px 8px;
      border: 1px solid var(--focus);
      border-radius: 7px;
      color: var(--text);
      background: var(--surface);
      font: inherit;
    }
    .code-tab-name-input::placeholder { color: var(--muted); }
    .code-tab-popover[hidden], .code-tab-row[hidden], .code-tab-row > [hidden] { display: none; }
    .code-tab-panel {
      position: relative;
      display: flex;
      flex: 1;
      min-height: 180px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
    }
    .code-tab-panel:focus-within { outline: 2px solid var(--focus); outline-offset: 1px; }
    main.editor-collapsed { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); height: 100dvh; }
    label { font-weight: 650; }
    textarea {
      flex: 1;
      width: 100%;
      min-height: 0;
      resize: none;
      padding: 16px;
      border: 0;
      border-radius: 7px;
      color: var(--editor-text);
      background: var(--surface);
      font: 14px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      tab-size: 2;
    }
    textarea:focus { outline: none; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    button {
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--surface);
      color: inherit;
      font: inherit;
      font-weight: 550;
      cursor: pointer;
    }
    .actions button:first-child { border-color: #4f46e5; background: #4f46e5; color: #fff; }
    button:hover { filter: brightness(.96); }
    button:disabled { opacity: .55; cursor: wait; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    #status { margin: 0; min-height: 21px; color: var(--muted); font-size: 12px; }
    #status.error { color: var(--error); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 160px; overflow: auto; }
    #storage-status { margin: 0; color: var(--error); font-size: 12px; }
    .backup-toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: min(440px, calc(100vw - 40px));
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      background: var(--surface);
      box-shadow: 0 4px 16px var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity 300ms ease, var(--theme-transition);
    }
    .backup-toast.visible { opacity: .85; pointer-events: auto; }
    .backup-toast.error { color: var(--error); border-color: var(--error); }
    .backup-toast[hidden] { display: none; }
    #backup-toast-message { overflow-wrap: anywhere; white-space: pre-line; }
    .preview-shell { position: relative; min-width: 0; min-height: 0; }
    .preview-shell > .preview { height: 100%; }
    .editor-resizer {
      position: absolute;
      top: 0;
      bottom: 0;
      left: -16px;
      z-index: 1;
      width: 16px;
      cursor: col-resize;
      touch-action: none;
      user-select: none;
    }
    .editor-resizer::after {
      content: '';
      position: absolute;
      inset: 0 7px;
      border-radius: 2px;
      background: var(--border);
      transition: background-color var(--theme-duration) ease;
    }
    .editor-resizer:hover::after,
    .editor-resizer:focus-visible::after,
    .resizing-editor .editor-resizer::after { background: var(--focus); }
    .editor-collapsed .editor-resizer { display: none; }
    .resizing-editor, .resizing-editor * { cursor: col-resize !important; user-select: none !important; }
    .editor-toggle {
      position: absolute;
      top: clamp(96px, 14vh, 200px);
      left: -8px;
      z-index: 2;
      display: grid;
      place-items: center;
      width: 28px;
      height: 44px;
      padding: 0;
      transform: translateX(-50%);
      box-shadow: 0 1px 5px var(--shadow);
    }
    .editor-toggle[aria-expanded="false"] svg { transform: rotate(180deg); }
    .editor-collapsed .editor-toggle { left: 0; }
    .preview {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
    }
    .viewport {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      cursor: grab;
      background-image: radial-gradient(var(--grid) 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .viewport.dragging { cursor: grabbing; }
    .drawing { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
    .drawing > svg { display: block; max-width: none !important; }
    .theme-outgoing {
      position: absolute;
      inset: 0;
      z-index: 0;
      isolation: isolate;
      overflow: hidden;
      pointer-events: none;
    }
    .participant-header {
      position: absolute;
      inset: 0 0 auto;
      z-index: 1;
      overflow: hidden;
      background: var(--surface);
      box-shadow: 0 1px 0 var(--grid);
      pointer-events: none;
    }
    .participant-header[hidden] { display: none; }
    .participant-header > svg { display: block; width: 100%; height: 100%; max-width: none !important; }
    .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--empty-text); pointer-events: none; }
    .hint {
      position: absolute;
      right: 12px;
      bottom: 12px;
      left: 12px;
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      pointer-events: none;
    }
    .hint span { display: inline-block; padding: 5px 10px; border-radius: 6px; background: var(--hint-bg); }
    .hint span.error { color: var(--error); }
    .reset-view, .copy-diagram, .theme-toggle, .copy-code {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 2;
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      padding: 0;
      overflow: hidden;
      border-radius: 18px;
      white-space: nowrap;
      font-size: 12px;
      transition: width 180ms ease, var(--theme-transition);
      box-shadow: 0 1px 4px var(--shadow);
      touch-action: manipulation;
    }
    .reset-view:disabled { cursor: default; }
    :is(.reset-view, .copy-diagram, .theme-toggle):not(:disabled):not(.copied):is(:hover, :focus-visible) { width: 156px; }
    .reset-view .control-label, .theme-toggle .control-label { display: none; }
    .copy-diagram { top: 56px; }
    .copy-diagram .copy-label, .copy-diagram .copy-check { display: none; }
    .copy-diagram:not(:disabled):not(.copied):is(:hover, :focus-visible) .copy-icon,
    .copy-diagram.copied .copy-icon, .copy-code.copied .copy-icon { display: none; }
    .copy-diagram:not(:disabled):not(.copied):is(:hover, :focus-visible) .copy-label,
    .copy-diagram.copied .copy-check, .copy-code.copied .copy-check { display: block; }
    .copy-diagram.copied, .copy-code.copied { color: var(--active-text); border-color: var(--active-border); background: var(--active-bg); }
    .copy-diagram:disabled:not([aria-busy="true"]) { cursor: default; }
    .copy-code {
      top: 4px;
      right: 8px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 150ms ease, visibility 0s linear 150ms, var(--theme-transition);
    }
    .code-tab-panel:hover .copy-code {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition-delay: 0s;
    }
    .copy-code:not(.copied) .copy-check { display: none; }
    .theme-toggle { top: 100px; }
    .theme-toggle .moon-icon { display: none; }
    :root[data-theme="dark"] .theme-toggle .sun-icon { display: none; }
    :root[data-theme="dark"] .theme-toggle .moon-icon { display: block; }
    :is(.reset-view, .theme-toggle):not(:disabled):is(:hover, :focus-visible) .control-icon { display: none; }
    :is(.reset-view, .theme-toggle):not(:disabled):is(:hover, :focus-visible) .control-label { display: block; }
    .header-toggle {
      position: absolute;
      top: 144px;
      right: 12px;
      z-index: 2;
      padding: 7px 10px;
      font-size: 12px;
      box-shadow: 0 1px 4px var(--shadow);
      touch-action: manipulation;
    }
    .header-toggle[hidden] { display: none; }
    .header-toggle[aria-pressed="true"] { border-color: var(--active-border); background: var(--active-bg); color: var(--active-text); }
    .standalone { height: 100dvh; }
    .standalone .preview { height: 100%; border: 0; border-radius: 0; }
    @media (prefers-reduced-motion: reduce) {
      :root { --theme-duration: 0ms; }
    }
    @media (max-width: 700px) {
      main { grid-template-columns: 1fr; grid-template-rows: minmax(272px, 40%) minmax(260px, 1fr); height: max(100dvh, 600px); padding: 12px; gap: 12px; }
      .editor-header { padding-top: 32px; }
      .code-tab-panel { min-height: 90px; }
      .editor-resizer { display: none; }
      .editor-toggle { top: -6px; left: 50%; width: 44px; height: 28px; transform: translate(-50%, -50%); }
      .editor-toggle svg { transform: rotate(90deg); }
      .editor-toggle[aria-expanded="false"] svg { transform: rotate(270deg); }
      .editor-collapsed .editor-toggle { top: 12px; left: 12px; width: 32px; height: 32px; transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <section id="code-panel" class="editor">
      <div class="editor-header">
        <label for="code">Mermaid code</label>
        <div id="code-tab-picker" class="code-tab-picker">
          <button id="code-tab-trigger" class="code-tab-trigger" type="button" data-tooltip="Browse Diagrams" aria-label="Browse Diagrams" aria-expanded="false" aria-controls="code-tab-popover">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <circle cx="4" cy="6" r="1" /><circle cx="4" cy="12" r="1" /><circle cx="4" cy="18" r="1" />
              <path d="M9 6h12M9 12h12M9 18h12" />
            </svg>
          </button>
          <div id="code-tab-popover" class="code-tab-popover" hidden>
            <div class="code-tab-menu">
              <button id="code-tabs-prev" class="code-tabs-page" type="button" title="이전 5개 탭" aria-label="이전 5개 탭" aria-controls="code-tabs" disabled>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6" /></svg>
              </button>
              <div id="code-tabs" class="code-tabs" role="tablist" aria-label="코드 탭" aria-orientation="vertical"></div>
              <button id="code-tabs-next" class="code-tabs-page" type="button" title="다음 5개 탭" aria-label="다음 5개 탭" aria-controls="code-tabs">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
              </button>
            </div>
          </div>
        </div>
        <button id="import-backup" class="backup-button" type="button" data-tooltip="백업 복원" aria-label="백업 복원">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M12 16V3m-5 5 5-5 5 5" />
          </svg>
        </button>
        <button id="export-backup" class="backup-button" type="button" data-tooltip="전체 탭 백업" aria-label="전체 탭 백업">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M12 3v13m-5-5 5 5 5-5" />
          </svg>
        </button>
        <button id="format-code" class="format-code" type="button" data-tooltip="코드 들여쓰기 정리" data-tooltip-align="end" aria-label="코드 들여쓰기 정리">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m5 4-3 3 3 3m14-6 3 3-3 3M10 7h4M3 14h18M7 18h14M7 22h10" />
          </svg>
        </button>
        <input id="backup-file" type="file" accept=".md,text/markdown" hidden>
      </div>
      <div id="code-tab-panel" class="code-tab-panel" role="tabpanel" aria-labelledby="code-tab-1">
        <button id="copy-code" class="copy-code" type="button" title="Copy code" aria-label="코드 전체 복사" aria-busy="false">
          <svg class="copy-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="8" y="7" width="12" height="15" rx="1" /><path d="M16 3H5a1 1 0 0 0-1 1v13" />
          </svg>
          <svg class="copy-check" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6" /></svg>
        </button>
        <textarea id="code" spellcheck="false" autocomplete="off" autocapitalize="off" wrap="off" aria-label="Mermaid 코드 편집기">flowchart LR
  A[코드 작성] --> B{Render}
  B --> C[현재 화면]
  B --> D[새 창]
  C --> E[확대 · 축소 · 이동]
  D --> E</textarea>
      </div>
      <div class="actions">
        <button id="render" type="button">Render</button>
        <button id="new-window" type="button">Render in new window</button>
      </div>
      <p id="status" role="status" aria-live="polite">⌘ / Ctrl + Enter로 렌더링</p>
      <p id="storage-status" role="status" aria-live="polite" hidden></p>
    </section>
    <div class="preview-shell">
      <div id="resize-editor" class="editor-resizer" role="separator" tabindex="0" aria-label="코드 편집기 너비 조절" aria-orientation="vertical" aria-controls="code-panel" aria-valuemin="280" title="드래그하여 코드 편집기 너비 조절"></div>
      <button id="toggle-editor" class="editor-toggle" type="button" title="코드 접기" aria-label="코드 접기" aria-controls="code-panel" aria-expanded="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m14 6-6 6 6 6" />
        </svg>
      </button>
      <section class="preview" aria-label="렌더링 결과">
        <div class="viewport" tabindex="0" aria-label="다이어그램. 휠로 확대 축소, 드래그로 이동, 더블클릭으로 화면 맞춤. 키보드: +, -, 0, 방향키.">
          <div class="drawing"></div>
          <div class="empty">코드를 입력하고 Render를 누르세요.</div>
          <p class="hint"><span>휠 / 핀치: 확대·축소 · 드래그: 이동 · 더블클릭: 화면 맞춤</span></p>
          <button class="reset-view" type="button" title="Reset view" aria-label="Reset view — 화면 맞춤" disabled>
            <svg class="control-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 10a9 9 0 1 1 2.6 8.4M3 4v6h6" />
            </svg>
            <span class="control-label" aria-hidden="true">Re-render</span>
          </button>
          <button class="copy-diagram" type="button" aria-label="Copy to Clipboard" aria-busy="false" disabled>
            <svg class="copy-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="8" y="3" width="8" height="4" rx="1" /><path d="M8 5H6a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2" />
            </svg>
            <span class="copy-label" aria-hidden="true">Copy to Clipboard</span>
            <svg class="copy-check" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6" /></svg>
          </button>
          <button class="theme-toggle" type="button" title="현재 밝은 모드 · 다크 모드로 전환" aria-label="현재 밝은 모드 · 다크 모드로 전환" aria-pressed="false">
            <svg class="sun-icon control-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" />
            </svg>
            <svg class="moon-icon control-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
            </svg>
            <span class="control-label" aria-hidden="true">Change Theme</span>

          <button class="header-toggle" type="button" title="헤더가 상단을 벗어날 때 고정" aria-label="헤더 상단 고정" aria-pressed="true" hidden>Header 고정 ON</button>
        </div>
      </section>
    </div>
  </main>
  <div id="backup-toast" class="backup-toast" role="alert" aria-atomic="true" hidden>
    <span id="backup-toast-message"></span>
  </div>
  <script>
    function formatMermaidCode(source) {
      let diagram = '', depth = 0, quote = '', directive = false, frontmatter = false, rawBlock = '';
      let firstContent = true;
      const delimiters = [];
      const isSequence = () => diagram === 'sequenceDiagram';
      const isFlow = () => /^(?:flowchart|graph|block(?:-beta)?)$/.test(diagram);
      const isState = () => /^stateDiagram(?:-v2)?$/.test(diagram);
      const structured = () => isSequence() || isFlow() || isState()
        || /^(?:classDiagram(?:-v2)?|erDiagram|requirementDiagram)$/.test(diagram);

      // Mask labels before interpreting block keywords. Keep multiline label contents verbatim.
      const scan = line => {
        let syntax = '', comment = false;
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (quote) {
            if (char === '\\') { i++; continue; }
            if (quote === 'markdown') {
              if (char === '`' && line[i + 1] === '"') { quote = ''; i++; }
            } else if (char === quote) quote = '';
            continue;
          }
          if (char === '"' || char === '`') {
            quote = char === '"' && line[i + 1] === '`' ? 'markdown' : char;
            if (quote === 'markdown') i++;
            syntax += 'x';
            continue;
          }
          if (isFlow()) {
            if ('[({'.includes(char)) { delimiters.push(char); syntax += 'x'; continue; }
            if (delimiters.length) {
              if (char === ({ '[': ']', '(': ')', '{': '}' })[delimiters.at(-1)]) delimiters.pop();
              continue;
            }
          }
          if (char === '%' && line[i + 1] === '%') { comment = true; break; }
          // Entity terminators are part of labels, not statement separators.
          if (char === '#') {
            const entity = /^#[\w]+;/.exec(line.slice(i));
            if (entity) { syntax += 'x'; i += entity[0].length - 1; continue; }
          }
          syntax += char;
        }
        return { syntax, comment };
      };
      const blockKind = statement => {
        if (isSequence()) {
          if (/^end$/.test(statement)) return 'close';
          if (/^(?:else|and|option)(?:\s|$)/.test(statement)) return 'branch';
          if (/^(?:loop|alt|opt|par|critical|break|rect|box)(?:\s|$)/.test(statement)) return 'open';
        } else if (isFlow()) {
          if (statement === 'end') return 'close';
          if (/^(?:flowchart|graph)$/.test(diagram) ? /^subgraph(?:\s|$)/.test(statement)
            : /^block(?:\s|:|$)/.test(statement)) return 'open';
        } else {
          if (statement === '}') return 'close';
          if (/^classDiagram/.test(diagram) && /^(?:class|namespace)\s.*\{$/.test(statement)) return 'open';
          if (isState() && /^state\s.*\{$/.test(statement)) return 'open';
          if (/^(?:erDiagram|requirementDiagram)$/.test(diagram) && /^[^:{}]+\{$/.test(statement)) return 'open';
        }
        return '';
      };

      return source.split(/(\r?\n)/).map((line, index) => {
        if (index % 2) return line;
        const trimmed = line.trim();
        if (firstContent && trimmed) {
          firstContent = false;
          if (trimmed === '---') { frontmatter = true; return line; }
        }
        if (frontmatter) {
          if (trimmed === '---') frontmatter = false;
          return line;
        }
        if (directive || (!quote && !delimiters.length && trimmed.startsWith('%%{'))) {
          directive = !trimmed.includes('}%%');
          return line;
        }
        if (rawBlock) {
          if (rawBlock === 'note' ? /^end\s+note\s*;?$/.test(trimmed) : /^}\s*;?$/.test(trimmed)) rawBlock = '';
          return line;
        }
        const continuation = Boolean(quote || delimiters.length);
        if (!continuation && trimmed.startsWith('%%')) return line;
        let header = false;
        if (!diagram) {
          if (!trimmed) return '';
          diagram = /^[\w-]+/.exec(trimmed)?.[0] || '';
          header = true;
        }
        // Indentation defines the structure of mindmap/kanban and some newer grammars.
        // Leave unrecognised grammars untouched rather than flattening their hierarchy.
        if (!structured()) return line;
        if (!continuation && /^accDescr\s*\{/.test(trimmed)) {
          if (!/}\s*$/.test(trimmed)) rawBlock = 'description';
          return line;
        }
        if (!continuation && isState() && /^note\s+(?:left|right)\s+of\s+[^:]+$/.test(trimmed)) {
          rawBlock = 'note';
          return line;
        }
        const { syntax, comment } = scan(line);
        if (continuation) return line;
        if (!trimmed) return '';
        const statements = syntax.split(';').map(value => value.trim()).filter(Boolean);
        if (header) statements.shift();
        const firstKind = blockKind(statements[0] || '');
        const indent = Math.max(0, depth - (firstKind === 'close' || firstKind === 'branch' ? 1 : 0));
        for (const statement of statements) {
          const kind = blockKind(statement);
          if (kind === 'close') depth = Math.max(0, depth - 1);
          if (kind === 'open') depth++;
        }
        const content = line.replace(/^[ \t]*/, '');
        return '  '.repeat(header ? 0 : indent + 1) + (quote || delimiters.length || comment ? content : content.trimEnd());
      }).join('');
    }

    function serializeMarkdownBackup(codes, names) {
      return codes.map((code, index) => {
        const name = (names[index] || 'Untitled').replace(/[\\[\]]/g, '\\$&');
        // Use a longer Markdown fence when the source itself contains backticks.
        let fenceLength = 3;
        for (const match of code.matchAll(/`+/g)) fenceLength = Math.max(fenceLength, match[0].length + 1);
        const fence = '`'.repeat(fenceLength);
        return `# ${index + 1} [${name}]\n## code\n${fence}mermaid\n${code}\n${fence}`;
      }).join('\n\n') + '\n';
    }

    function parseMarkdownBackup(text, tabCount) {
      const lines = text.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n').split('\n');
      const codes = Array(tabCount).fill(''), names = Array(tabCount).fill('');
      const seen = new Set();
      let line = 0;
      const fail = message => { throw new Error(`백업 형식 오류 (${line + 1}행): ${message}`); };
      const skipBlankLines = () => {
        while (line < lines.length && /^[ \t]*$/.test(lines[line])) line++;
      };
      skipBlankLines();
      if (line === lines.length) fail('탭 내용이 없는 파일입니다.');
      while (line < lines.length) {
        const heading = /^#[ \t]+([1-9]\d*)[ \t]+\[(.*)\][ \t]*$/.exec(lines[line]);
        if (!heading) fail('"# 탭번호 [탭 이름]" 제목이 필요합니다.');
        const number = Number(heading[1]);
        if (!Number.isInteger(number) || number > tabCount) fail(`탭 번호는 1~${tabCount}만 사용할 수 있습니다.`);
        if (seen.has(number)) fail(`${number}번 탭이 중복되었습니다.`);
        const name = heading[2].replace(/\\([\\[\]])/g, '$1').trim() || 'Untitled';
        if (name.length > 60) fail('탭 이름은 60자 이하여야 합니다.');
        line++;
        skipBlankLines();
        // Accept both the documented section heading and the shorter example format.
        if (/^##[ \t]+code[ \t]*$/.test(lines[line] || '')) {
          line++;
          skipBlankLines();
        }
        const opening = /^(`{3,})[ \t]*mermaid[ \t]*$/.exec(lines[line] || '');
        if (!opening) fail('mermaid 코드 블록이 필요합니다.');
        line++;
        const body = [];
        let closed = false;
        while (line < lines.length) {
          const closing = /^(`{3,})[ \t]*$/.exec(lines[line]);
          if (closing && closing[1].length >= opening[1].length) {
            closed = true;
            break;
          }
          body.push(lines[line++]);
        }
        if (!closed) fail(`${number}번 탭의 코드 블록이 닫히지 않았습니다.`);
        seen.add(number);
        codes[number - 1] = body.join('\n');
        names[number - 1] = name;
        line++;
        skipBlankLines();
      }
      return { codes, names, activeTab: Math.min(...seen) - 1, count: seen.size };
    }

    function bindCodeCopy(editor, button, onError) {
      let busy = false, revision = 0, timer;
      const reset = () => {
        revision++;
        clearTimeout(timer);
        button.classList.remove('copied');
        button.title = 'Copy code';
        button.setAttribute('aria-label', '코드 전체 복사');
      };
      editor.addEventListener('input', reset);
      button.addEventListener('click', async () => {
        if (busy) return;
        reset();
        const requestedRevision = revision;
        const source = editor.value;
        busy = button.disabled = true;
        button.setAttribute('aria-busy', 'true');
        try {
          if (!navigator.clipboard?.writeText) {
            throw new Error('코드 복사를 사용할 수 없습니다. 지원 브라우저에서 HTTPS 또는 localhost로 열어주세요.');
          }
          await navigator.clipboard.writeText(source);
          if (requestedRevision !== revision || editor.value !== source) return;
          button.classList.add('copied');
          button.title = 'Copied!';
          button.setAttribute('aria-label', '코드 복사 완료');
          timer = setTimeout(reset, 1500);
        } catch (error) {
          if (requestedRevision === revision) {
            onError(error.name === 'NotAllowedError'
              ? '코드 복사가 허용되지 않았습니다. 브라우저의 클립보드 권한을 확인하세요.'
              : error.message || '코드를 복사하지 못했습니다.');
          }
        } finally {
          busy = button.disabled = false;
          button.setAttribute('aria-busy', 'false');
        }
      });
      return reset;
    }

    // Shared with the standalone popup; each window owns its theme and renderer.
    function bindThemeToggle(initialTheme, onChange) {
      const button = document.querySelector('.theme-toggle');
      let theme = initialTheme === 'dark' ? 'dark' : 'light';
      const apply = () => {
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="color-scheme"]')?.setAttribute('content', theme);
        const label = theme === 'dark' ? '현재 다크 모드 · 밝은 모드로 전환' : '현재 밝은 모드 · 다크 모드로 전환';
        button.title = label;
        button.setAttribute('aria-label', label);
        button.setAttribute('aria-pressed', String(theme === 'dark'));
      };
      button.addEventListener('pointerdown', event => event.stopPropagation());
      button.addEventListener('dblclick', event => event.stopPropagation());
      button.addEventListener('click', () => {
        theme = theme === 'dark' ? 'light' : 'dark';
        apply();
        onChange(theme);
      });
      apply();
    }

    function createDiagramRenderer() {
      let mermaidPromise, renderId = 0;
      const prefix = `diagram-${Math.random().toString(36).slice(2)}`;
      const load = () => {
        if (!mermaidPromise) {
          mermaidPromise = import('https://cdn.jsdelivr.net/npm/mermaid@12.2.0/dist/mermaid.esm.min.mjs')
            .then(({ default: mermaid }) => mermaid)
            .catch(() => {
              mermaidPromise = undefined;
              throw new Error('Mermaid를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 다시 렌더링하세요.');
            });
        }
        return mermaidPromise;
      };
      return {
        load,
        async render(source, theme) {
          const mermaid = await load();
          mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', suppressErrorRendering: true,
            theme: theme === 'dark' ? 'dark' : 'default', darkMode: theme === 'dark', fontFamily: 'system-ui, sans-serif' });
          const scratch = document.createElement('div');
          scratch.style.cssText = 'position:fixed;left:-100000px;top:0;width:1200px;visibility:hidden;pointer-events:none;';
          document.body.append(scratch);
          try {
            const { svg } = await mermaid.render(`${prefix}-${++renderId}`, source, scratch);
            return svg;
          } finally {
            scratch.remove();
          }
        }
      };
    }

    async function diagramToPNG(svg, background, participantOpacities) {
      // Snapshot synchronously so a later pan, theme change, or tab switch cannot alter the copy.
      const snapshot = svg.cloneNode(true);
      const width = Number(svg.getAttribute('width'));
      let height = Number(svg.getAttribute('height'));
      if (!(width > 0 && height > 0 && Number.isFinite(width * height))) throw new Error('복사할 다이어그램 크기가 올바르지 않습니다.');
      const viewBox = svg.viewBox.baseVal;
      const exportX = viewBox.width && viewBox.height ? viewBox.x : 0;
      let exportY = viewBox.width && viewBox.height ? viewBox.y : 0;
      try {
        // Measure in SVG coordinates, independent of the viewer's pan/zoom. Opacity-hidden
        // participants still contribute to this box and are restored in the snapshot below.
        const bounds = svg.getBBox();
        if (bounds.height > 0 && Number.isFinite(bounds.y) && Number.isFinite(bounds.height)) {
          // Keep horizontal margins; replace Mermaid's asymmetric vertical margins.
          // The padding also leaves room for ordinary strokes, markers, and shadows.
          const padding = 16;
          exportY = bounds.y - padding;
          height = bounds.height + padding * 2;
        }
      } catch {
        // Retain the original extent if the browser cannot measure this SVG.
      }
      // Bound both SVG image decoding and canvas memory without cropping long diagrams.
      const ratio = Math.min(2, Math.max(1, window.devicePixelRatio || 1),
        16384 / width, 16384 / height, Math.sqrt(16777216 / (width * height)));
      const pixelWidth = Math.max(1, Math.floor(width * ratio));
      const pixelHeight = Math.max(1, Math.floor(height * ratio));
      const originals = [svg, ...svg.querySelectorAll('*')];
      const clones = [snapshot, ...snapshot.querySelectorAll('*')];
      const properties = ('color font-family font-size font-style font-weight font-variant line-height letter-spacing '
        + 'text-align text-decoration text-transform white-space word-break overflow-wrap box-sizing '
        + 'fill fill-opacity stroke stroke-opacity stroke-width stroke-dasharray stroke-linecap stroke-linejoin '
        + 'opacity visibility display text-anchor dominant-baseline paint-order background-color '
        + 'border-color border-style border-width border-radius padding margin').split(' ');
      const pageURL = document.URL.split('#')[0];
      const localReferences = value => value.replace(/url\(\s*(['"]?)(.*?)\1\s*\)/g, (match, quote, reference) => {
        try {
          const url = new URL(reference, document.baseURI);
          return url.hash && url.href.split('#')[0] === pageURL ? `url("${url.hash}")` : match;
        } catch { return match; }
      });
      originals.forEach((element, index) => {
        const clone = clones[index];
        if (element.localName === 'style') {
          clone.textContent = localReferences(element.textContent);
          return;
        }
        const computed = getComputedStyle(element);
        for (const property of properties) clone.style.setProperty(property, computed.getPropertyValue(property));
        if (participantOpacities.has(element)) clone.style.opacity = participantOpacities.get(element);
        for (const attribute of [...clone.attributes]) {
          const value = localReferences(attribute.value);
          if (value !== attribute.value) clone.setAttributeNS(attribute.namespaceURI, attribute.name, value);
        }
        if (element.localName === 'img') {
          clone.setAttribute('src', element.currentSrc || element.getAttribute('src') || '');
          clone.removeAttribute('srcset');
          clone.removeAttribute('loading');
        }
      });
      snapshot.setAttribute('viewBox', `${exportX} ${exportY} ${width} ${height}`);
      snapshot.setAttribute('width', pixelWidth);
      snapshot.setAttribute('height', pixelHeight);
      snapshot.style.setProperty('max-width', 'none', 'important');
      snapshot.style.width = `${pixelWidth}px`;
      snapshot.style.height = `${pixelHeight}px`;

      await document.fonts?.ready;
      // SVG images cannot load external resources; embed diagram images before rasterizing.
      await Promise.all([...snapshot.querySelectorAll('image, feImage, img')].map(async element => {
        const htmlImage = element.localName === 'img';
        const href = htmlImage ? element.getAttribute('src') : element.getAttribute('href')
          || element.getAttributeNS('http://www.w3.org/1999/xlink', 'href');
        if (!href || /^(?:data:|#)/i.test(href)) return;
        try {
          const response = await fetch(new URL(href, document.baseURI), { signal: AbortSignal.timeout(10000) });
          if (!response.ok) throw new Error('Image request failed');
          const blob = await response.blob();
          const dataURL = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = () => reject(reader.error);
            reader.readAsDataURL(blob);
          });
          element.setAttribute(htmlImage ? 'src' : 'href', dataURL);
          if (!htmlImage) element.removeAttributeNS('http://www.w3.org/1999/xlink', 'href');
        } catch {
          throw new Error('다이어그램의 외부 이미지를 복사할 수 없습니다. 이미지 주소와 CORS 설정을 확인하세요.');
        }
      }));
      const image = new Image();
      await new Promise((resolve, reject) => {
        image.onload = resolve;
        image.onerror = () => reject(new Error('다이어그램을 PNG 이미지로 변환하지 못했습니다.'));
        // A data URL also supports Mermaid's HTML labels inside foreignObject.
        image.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(snapshot));
      });
      const canvas = document.createElement('canvas');
      canvas.width = pixelWidth;
      canvas.height = pixelHeight;
      try {
        const context = canvas.getContext('2d');
        if (!context) throw new Error('이미지 복사에 필요한 Canvas를 사용할 수 없습니다.');
        context.fillStyle = background || '#fff';
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.drawImage(image, 0, 0, canvas.width, canvas.height);
        return await new Promise((resolve, reject) => canvas.toBlob(blob => {
          if (blob) resolve(blob);
          else reject(new Error('PNG 이미지를 만들지 못했습니다.'));
        }, 'image/png'));
      } finally {
        canvas.width = canvas.height = 0;
      }
    }

    function initializePopup(svg, source, initialTheme) {
      const viewport = document.querySelector('.viewport');
      const renderer = createDiagramRenderer();
      const button = viewport.querySelector('.theme-toggle');
      const hint = viewport.querySelector('.hint span');
      const hintText = hint.textContent;
      hint.setAttribute('role', 'status');
      const viewer = createViewer(viewport, message => {
        hint.textContent = message;
        hint.classList.add('error');
      });
      let currentTheme = initialTheme, renderedTheme = initialTheme, updating = false;
      bindThemeToggle(initialTheme, theme => {
        currentTheme = theme;
        hint.textContent = hintText;
        hint.classList.remove('error');
        void updateTheme();
      });
      viewer.setSVG(svg);
      async function updateTheme() {
        if (updating) return;
        updating = true;
        button.setAttribute('aria-busy', 'true');
        try {
          while (renderedTheme !== currentTheme) {
            const requestedTheme = currentTheme;
            try {
              const markup = await renderer.render(source, requestedTheme);
              if (requestedTheme !== currentTheme) continue;
              viewer.setSVG(markup, true);
              renderedTheme = requestedTheme;
            } catch (error) {
              if (requestedTheme !== currentTheme) continue;
              hint.textContent = error.message || String(error);
              hint.classList.add('error');
              break;
            }
          }
        } finally {
          updating = false;
          button.setAttribute('aria-busy', 'false');
        }
      }
    }

    // This function is also embedded in the popup, so that it works after the editor closes.
    function createViewer(viewport, onCopyError) {
      const drawing = viewport.querySelector('.drawing');
      const resetButton = viewport.querySelector('.reset-view');
      const copyButton = viewport.querySelector('.copy-diagram');
      const headerToggle = viewport.querySelector('.header-toggle');
      const header = viewport.querySelector('.participant-header') || document.createElement('div');
      header.className = 'participant-header';
      header.hidden = true;
      header.setAttribute('aria-hidden', 'true');
      drawing.after(header);
      const pointers = new Map();
      let width = 0, height = 0, scale = 1, fitScale = 1, x = 0, y = 0;
      let contentBounds = [];
      let headerItems = [], headerSVG, headerTop = 0, headerNaturalHeight = 0;
      let headerScale = 1, headerHeight = 0, bodyTop = 0;
      let headerEnabled = true;
      let themeFade;
      const finishThemeFade = () => {
        if (!themeFade) return;
        const previous = themeFade;
        themeFade = undefined;
        previous.animations.forEach(animation => animation.cancel());
        previous.layer.remove();
      };
      const snapshotTheme = () => {
        const layer = document.createElement('div');
        layer.className = 'theme-outgoing';
        layer.setAttribute('aria-hidden', 'true');
        layer.inert = true;
        layer.append(drawing.cloneNode(true));
        if (!header.hidden) {
          const previousHeader = header.cloneNode(true);
          const style = getComputedStyle(header);
          previousHeader.style.backgroundColor = style.backgroundColor;
          previousHeader.style.boxShadow = style.boxShadow;
          previousHeader.style.transition = 'none';
          layer.append(previousHeader);
        }
        return layer;
      };
      const startThemeFade = (layer, duration) => {
        // Mermaid gives each render distinct IDs, so both SVGs can coexist during the fade.
        drawing.before(layer);
        const options = { duration, easing: 'ease', fill: 'both' };
        const animations = [
          layer.animate([{ opacity: 1 }, { opacity: 0 }], options),
          drawing.animate([{ opacity: 0 }, { opacity: 1 }], options)
        ];
        if (!header.hidden) animations.push(header.animate([{ opacity: 0 }, { opacity: 1 }], options));
        const fade = { layer, animations };
        themeFade = fade;
        const finish = () => { if (themeFade === fade) finishThemeFade(); };
        void Promise.all(animations.map(animation => animation.finished)).then(finish, finish);
      };
      let copyBusy = false, copyRevision = 0, copyTimer, copyBackground = '';
      const resetCopyFeedback = () => {
        clearTimeout(copyTimer);
        copyButton.classList.remove('copied');
        copyButton.setAttribute('aria-label', 'Copy to Clipboard');

      codeTabsNext.disabled = pageEnd === codeTabCount;
      codeTabList.setAttribute('aria-label', `코드 탭 ${pageStart + 1}~${pageEnd}`);
      codeTabPanel.setAttribute('aria-labelledby', codeTabButtons[activeCodeTab].id);
      codeTabTrigger.setAttribute('aria-label', `Browse Diagrams · 현재 ${codeTabLabel(activeCodeTab)}`);
      editor.setAttribute('aria-label', `Mermaid 코드 편집기 — ${codeTabLabel(activeCodeTab)}`);
    };
    const saveCodeTabs = () => {
      clearTimeout(saveTimer);
      saveTimer = undefined;
      codeTabs[activeCodeTab] = editor.value;
      const state = serializeCodeTabs();
      if (state === savedTabState) return;
      try {
        localStorage.setItem(codeStorageKey, state);
        savedTabState = state;
        storageStatus.hidden = true;
        showBackupToast('💾 Saved!', false, 1500);
      } catch {
        showStorageError('코드를 저장하지 못했습니다. 현재 내용은 이 페이지에서만 유지됩니다.');
      }
    };
    const scheduleCodeSave = () => {
      codeTabs[activeCodeTab] = editor.value;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveCodeTabs, 500);
    };
    const renderSelectedTab = () => {
      pendingTabRender = false;
      if (!editor.value.trim()) {
        status.className = '';
        status.textContent = `${codeTabLabel(activeCodeTab)} · 코드를 입력하세요.`;
        return;
      }
      if (rendering) {
        pendingTabRender = true;
        status.textContent = '렌더링 대기 중…';
        return;
      }
      void render();
    };
    const selectCodeTab = index => {
      if (!Number.isInteger(index) || index < 0 || index >= codeTabCount) return;
      if (index === activeCodeTab) return;
      codeTabs[activeCodeTab] = editor.value;
      activeCodeTab = index;
      codeTabPage = Math.floor(index / codeTabsPerPage);
      tabRevision++;
      editor.value = codeTabs[index];
      resetCodeCopy();
      editor.setSelectionRange(0, 0);
      editor.scrollTop = editor.scrollLeft = 0;
      syncCodeTabUI();
      // Flush the outgoing code and new active tab in a single storage write.
      saveCodeTabs();
      viewer.clear();
      lastRenderedSource = '';
      preserveViewOnThemeChange = false;
      status.className = '';
      renderSelectedTab();
    };

    const finishTabRename = (commit, restoreFocus = false) => {
      if (renamingTab < 0) return;
      const index = renamingTab;
      renamingTab = -1;
      const { button, input, rename } = codeTabRows[index];
      const name = input.value.trim();
      if (commit && name !== codeTabNames[index]) {
        codeTabNames[index] = name;
        scheduleCodeSave();
      }
      input.hidden = true;
      button.hidden = rename.hidden = false;
      syncCodeTabUI();
      if (restoreFocus) rename.focus();
    };
    const openTabMenu = () => {
      if (codeTabPopover.hidden) {
        codeTabPage = Math.floor(activeCodeTab / codeTabsPerPage);
        syncCodeTabUI();
      }
      codeTabPopover.hidden = false;
      codeTabTrigger.setAttribute('aria-expanded', 'true');
    };
    const closeTabMenu = (restoreFocus = false) => {
      const focusInside = codeTabPopover.contains(document.activeElement);
      finishTabRename(true);
      codeTabPopover.hidden = true;
      codeTabTrigger.setAttribute('aria-expanded', 'false');
      if (restoreFocus || focusInside) codeTabTrigger.focus();
    };
    const moveCodeTabPage = direction => {
      const lastPage = Math.ceil(codeTabCount / codeTabsPerPage) - 1;
      const nextPage = Math.max(0, Math.min(lastPage, codeTabPage + direction));
      if (nextPage === codeTabPage) return;
      const focused = document.activeElement;
      finishTabRename(true);
      codeTabPage = nextPage;
      syncCodeTabUI();
      // Keep focus in the menu when a row disappears or an arrow becomes disabled.
      if ((focused === codeTabsPrev && codeTabsPrev.disabled)
        || (focused === codeTabsNext && codeTabsNext.disabled)
        || codeTabRows.some(({ row }) => row.hidden && row.contains(focused))) {
        codeTabButtons[visibleTabStop()].focus({ preventScroll: true });
      }
    };

    // Read storage once on load. All edits and tab switches use the in-memory state.
    try {
      const stored = localStorage.getItem(codeStorageKey);
      if (stored !== null) {
        const data = JSON.parse(stored);
        if (!data || !Array.isArray(data.codes) || ![codeTabsPerPage, codeTabCount].includes(data.codes.length)
          || !data.codes.every(code => typeof code === 'string')) throw new Error('Invalid saved tabs');
        // Extend old five-tab saves in memory without an extra storage write on load.
        codeTabs = Array.from({ length: codeTabCount }, (_, index) => data.codes[index] ?? '');
        if (Array.isArray(data.names) && data.names.length === data.codes.length && data.names.every(name => typeof name === 'string')) {
          codeTabNames = Array.from({ length: codeTabCount }, (_, index) => (data.names[index] ?? '').trim().slice(0, 60));
        }
        if (Number.isInteger(data.activeTab) && data.activeTab >= 0 && data.activeTab < data.codes.length) activeCodeTab = data.activeTab;
      }
    } catch {
      showStorageError('저장된 코드를 불러오지 못했습니다.');
    }
    savedTabState = serializeCodeTabs();
    editor.value = codeTabs[activeCodeTab];
    codeTabPage = Math.floor(activeCodeTab / codeTabsPerPage);
    syncCodeTabUI();
    codeTabPicker.addEventListener('focusout', event => {
      // activeElement can temporarily be body while focus moves between menu controls.
      // A missing target also occurs when pagination hides or disables a focused control.
      if (event.relatedTarget && !codeTabPicker.contains(event.relatedTarget)) closeTabMenu();
    });
    codeTabPicker.addEventListener('keydown', event => {
      if (event.key !== 'Escape' || event.isComposing) return;
      event.preventDefault();
      closeTabMenu(true);
    });
    codeTabTrigger.addEventListener('click', () => {
      if (codeTabPopover.hidden) openTabMenu();
      else closeTabMenu();
    });
    codeTabTrigger.addEventListener('keydown', event => {
      if (codeTabPopover.hidden || !['ArrowDown', 'ArrowUp'].includes(event.key)) return;
      event.preventDefault();
      codeTabButtons[visibleTabStop()].focus();
    });
    codeTabsPrev.addEventListener('click', () => moveCodeTabPage(-1));
    codeTabsNext.addEventListener('click', () => moveCodeTabPage(1));
    document.addEventListener('pointerdown', event => {
      if (!codeTabPicker.contains(event.target)) closeTabMenu();
    });
    codeTabButtons.forEach((button, index) => {
      button.addEventListener('click', () => {
        finishTabRename(true);
        selectCodeTab(index);
        closeTabMenu();
        editor.focus({ preventScroll: true });
      });
      button.addEventListener('keydown', event => {
        if (event.ctrlKey || event.metaKey || event.altKey || event.isComposing) return;
        let next;
        if (event.key === 'ArrowUp' || event.key === 'ArrowLeft') next = Math.max(0, index - 1);
        else if (event.key === 'ArrowDown' || event.key === 'ArrowRight') next = Math.min(codeTabCount - 1, index + 1);
        else if (event.key === 'Home') next = codeTabPage * codeTabsPerPage;
        else if (event.key === 'End') next = Math.min(codeTabCount - 1, (codeTabPage + 1) * codeTabsPerPage - 1);
        else return;
        event.preventDefault();
        selectCodeTab(next);
        codeTabButtons[next].focus();
      });
    });
    codeTabRows.forEach(({ button, input, rename }, index) => {
      rename.addEventListener('click', () => {
        finishTabRename(true);
        renamingTab = index;
        input.value = codeTabNames[index];
        button.hidden = rename.hidden = true;
        input.hidden = false;
        input.focus();
        input.select();
      });
      input.addEventListener('blur', () => {
        if (renamingTab === index) finishTabRename(true);
      });
      input.addEventListener('keydown', event => {
        if (event.isComposing || !['Enter', 'Escape'].includes(event.key)) return;
        event.preventDefault();
        event.stopPropagation();
        finishTabRename(event.key === 'Enter', true);
      });
    });
    editor.addEventListener('input', scheduleCodeSave);
    const flushCodeTabs = () => {
      finishTabRename(true);
      saveCodeTabs();
    };
    window.addEventListener('pagehide', flushCodeTabs);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') flushCodeTabs();
    });

    const importBackupButton = document.getElementById('import-backup');
    const exportBackupButton = document.getElementById('export-backup');
    const backupFileInput = document.getElementById('backup-file');
    const backupToast = document.getElementById('backup-toast');
    const backupToastMessage = document.getElementById('backup-toast-message');
    const backupToastFadeDuration = 300;
    let backupToastTimer, backupToastHideTimer, backupToastFadeEnd = 0, importingBackup = false;
    const hideBackupToast = () => {
      clearTimeout(backupToastTimer);
      clearTimeout(backupToastHideTimer);
      if (backupToast.hidden) return;
      backupToast.classList.remove('visible');
      backupToast.inert = true;
      backupToastHideTimer = setTimeout(() => {
        backupToast.hidden = true;
      }, backupToastFadeDuration);
    };
    const showBackupToast = (message, isError = true, duration = isError ? 8000 : 4000) => {
      clearTimeout(backupToastTimer);
      clearTimeout(backupToastHideTimer);
      if (!backupToast.classList.contains('visible')) {
        backupToastFadeEnd = performance.now() + backupToastFadeDuration;
      }
      backupToast.classList.toggle('error', isError);
      backupToast.setAttribute('role', isError ? 'alert' : 'status');
      backupToastMessage.textContent = message;
      if (backupToast.hidden) {
        backupToast.hidden = false;
        // Commit opacity: 0 before starting the transition from a hidden element.
        void backupToast.offsetWidth;
      }
      backupToast.inert = false;
      backupToast.classList.add('visible');
      // Refresh the hold time without restarting an in-progress fade-in.
      const remainingFade = Math.max(0, backupToastFadeEnd - performance.now());
      backupToastTimer = setTimeout(hideBackupToast, remainingFade + duration);
    };
    exportBackupButton.addEventListener('click', () => {
      closeTabMenu();
      const codes = codeTabs.slice();
      codes[activeCodeTab] = editor.value;
      try {
        const markdown = serializeMarkdownBackup(codes, codeTabNames);
        const url = URL.createObjectURL(new Blob([markdown], { type: 'text/markdown;charset=utf-8' }));
        const link = document.createElement('a');
        link.href = url;
        link.download = `mermaid-backup-${new Date().toISOString().replace(/[:.]/g, '-')}.md`;
        document.body.append(link);
        try {
          link.click();
        } finally {
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        }
      } catch {
        showBackupToast('백업 파일을 만들지 못했습니다. 다시 시도하세요.');
      }
    });
    importBackupButton.addEventListener('click', () => {
      if (importingBackup) return;
      closeTabMenu();
      backupFileInput.click();
    });
    backupFileInput.addEventListener('change', async () => {
      const file = backupFileInput.files[0];
      backupFileInput.value = '';
      if (!file || importingBackup) return;
      importingBackup = true;
      importBackupButton.disabled = true;
      importBackupButton.setAttribute('aria-busy', 'true');
      hideBackupToast();
      try {
        if (!/\.md$/i.test(file.name)) throw new Error('.md 형식의 백업 파일을 선택하세요.');
        let text;
        try {
          text = await file.text();
        } catch {
          throw new Error('백업 파일을 읽지 못했습니다. 다시 선택하세요.');
        }
        const backup = parseMarkdownBackup(text, codeTabCount);
        const state = JSON.stringify({ codes: backup.codes, names: backup.names, activeTab: backup.activeTab });
        // Validate the entire file and persist it before replacing any current tabs.
        try {
          localStorage.setItem(codeStorageKey, state);
        } catch {
          throw new Error('백업을 저장하지 못했습니다. 저장 공간이나 브라우저 설정을 확인하세요. 기존 탭은 유지됩니다.');
        }
        clearTimeout(saveTimer);
        saveTimer = undefined;
        finishTabRename(false);
        codeTabs = backup.codes;
        codeTabNames = backup.names;
        activeCodeTab = backup.activeTab;
        codeTabPage = Math.floor(activeCodeTab / codeTabsPerPage);
        savedTabState = state;
        tabRevision++;
        closeTabMenu();
        editor.value = codeTabs[activeCodeTab];
        resetCodeCopy();
        editor.setSelectionRange(0, 0);
        editor.scrollTop = editor.scrollLeft = 0;
        syncCodeTabUI();
        viewer.clear();
        lastRenderedSource = '';
        preserveViewOnThemeChange = false;
        storageStatus.hidden = true;
        status.className = '';
        editor.focus({ preventScroll: true });
        renderSelectedTab();
        showBackupToast(`${backup.count}개 탭을 가져왔습니다. 파일에 없는 탭은 비웠습니다.`, false);
      } catch (error) {
        showBackupToast(error.message || '백업을 가져오지 못했습니다.');
      } finally {
        importingBackup = false;
        importBackupButton.disabled = false;
        importBackupButton.setAttribute('aria-busy', 'false');
      }
    });

    bindThemeToggle(currentTheme, theme => {
      currentTheme = theme;
      tabRevision++;
      preserveViewOnThemeChange = true;
      if (!editor.value.trim()) {
        viewer.clear();
        lastRenderedSource = '';
      }
      status.className = '';
      renderSelectedTab();
    });

    async function render(inNewWindow = false) {
      if (rendering) return;
      const requestedTabRevision = tabRevision;
      const requestedTheme = currentTheme;
      status.className = '';
      const source = editor.value.trim();
      if (!source) {
        status.className = 'error';
        status.textContent = 'Mermaid 코드를 입력하세요.';
        editor.focus();
        return;
      }
      // Open synchronously within the click handler, before any await.
      const popup = inNewWindow ? window.open('', '_blank', 'popup,width=1200,height=800') : null;
      if (inNewWindow && !popup) {
        status.className = 'error';
        status.textContent = '팝업이 차단되었습니다. 이 페이지의 팝업을 허용하세요.';
        return;
      }
      if (popup) {
        popup.opener = null;
        popup.document.title = 'Mermaid Viewer';
        popup.document.body.textContent = '렌더링 중…';
      }
      rendering = true;
      renderButton.disabled = windowButton.disabled = true;
      status.textContent = '렌더링 중…';
      try {
        await diagramRenderer.load();
        if (!popup && requestedTabRevision !== tabRevision) return;
        const svg = await diagramRenderer.render(source, requestedTheme);
        if (popup) {
          if (popup.closed) throw new Error('결과 창이 닫혔습니다. 새 창 렌더링을 다시 실행하세요.');
          // Escape < so code and labels cannot terminate the popup's script element.
          const svgLiteral = JSON.stringify(svg).replace(/</g, '\\u003c');
          const sourceLiteral = JSON.stringify(source).replace(/</g, '\\u003c');
          popup.document.open();
          popup.document.write(`<!doctype html><html lang="ko" data-theme="${requestedTheme}"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="${requestedTheme}"><title>Mermaid Viewer</title><style>${styles}</style><\/head><body class="standalone">${previewMarkup}<script>${bindThemeToggle.toString()}\n${createDiagramRenderer.toString()}\n${diagramToPNG.toString()}\n${createViewer.toString()}\n(${initializePopup.toString()})(${svgLiteral}, ${sourceLiteral}, ${JSON.stringify(requestedTheme)});<\/script><\/body><\/html>`);
          popup.document.close();
        } else if (requestedTabRevision === tabRevision) {
          viewer.setSVG(svg, source === lastRenderedSource && preserveViewOnThemeChange);
          lastRenderedSource = source;
          preserveViewOnThemeChange = false;
        }
        if (requestedTabRevision === tabRevision) {
          status.textContent = inNewWindow ? '새 창 렌더링 완료' : '렌더링 완료 · ⌘ / Ctrl + Enter로 다시 렌더링';
        }
      } catch (error) {
        if (popup && !popup.closed) popup.close();
        if (requestedTabRevision === tabRevision) {
          status.className = 'error';
          status.textContent = error.message || String(error);
        }
      } finally {
        rendering = false;
        renderButton.disabled = windowButton.disabled = false;
        // Process only the latest selected tab after the current render settles.
        if (pendingTabRender) renderSelectedTab();
      }
    }

    function formatEditor() {
      closeTabMenu();
      const { value, selectionStart: start, selectionEnd: end, selectionDirection: direction, scrollTop, scrollLeft } = editor;
      if (!value.trim()) return;
      const formatted = formatMermaidCode(value);
      if (formatted === value) {
        showBackupToast('정렬할 변경 사항이 없습니다.', false);
        return;
      }
      const oldLines = value.split('\n'), newLines = formatted.split('\n');
      const mapPosition = position => {
        let oldOffset = 0, newOffset = 0;
        for (let i = 0; i < oldLines.length; i++) {
          if (position <= oldOffset + oldLines[i].length) {
            const oldIndent = oldLines[i].match(/^[ \t]*/)[0].length;
            const newIndent = newLines[i].match(/^[ \t]*/)[0].length;
            const column = Math.max(0, position - oldOffset + newIndent - oldIndent);
            return newOffset + Math.min(column, newLines[i].length);
          }
          oldOffset += oldLines[i].length + 1;
          newOffset += newLines[i].length + 1;
        }
        return formatted.length;
      };
      editor.focus({ preventScroll: true });
      editor.setSelectionRange(0, value.length);
      if (!document.execCommand('insertText', false, formatted)) {
        editor.setRangeText(formatted, 0, value.length, 'end');
        editor.dispatchEvent(new Event('input', { bubbles: true }));
      }
      editor.setSelectionRange(mapPosition(start), mapPosition(end), direction);
      editor.scrollTop = scrollTop;
      editor.scrollLeft = scrollLeft;
      scheduleCodeSave();
      showBackupToast('현재 탭의 코드를 정렬했습니다.', false);
    }

    function indentEditor(outdent) {
      const { value, selectionStart: start, selectionEnd: end, selectionDirection: direction, scrollTop, scrollLeft } = editor;
      let from = start, to = end, replacement = '  ', nextStart = start + 2, nextEnd = start + 2;
      if (outdent || start !== end) {
        from = start === 0 ? 0 : value.lastIndexOf('\n', start - 1) + 1;
        // A selection ending at the start of a line does not include that line.
        const lastSelected = end > start && value[end - 1] === '\n' ? end - 1 : end;
        const lineEnd = value.indexOf('\n', lastSelected);
        to = lineEnd === -1 ? value.length : lineEnd;
        nextStart = start;
        nextEnd = end;
        let offset = from;
        replacement = value.slice(from, to).split('\n').map(line => {
          const removed = outdent ? (line.match(/^(?:\t| {1,2})/)?.[0].length || 0) : 0;
          const shift = position => outdent
            ? -Math.min(removed, Math.max(0, position - offset))
            : (position >= offset ? 2 : 0);
          nextStart += shift(start);
          nextEnd += shift(end);
          offset += line.length + 1;
          return outdent ? line.slice(removed) : '  ' + line;
        }).join('\n');
      }
      if (replacement === value.slice(from, to)) return;
      editor.setSelectionRange(from, to);
      // Native text insertion preserves the browser's undo/redo history.
      if (!document.execCommand('insertText', false, replacement)) {
        editor.setRangeText(replacement, from, to, 'end');
        editor.dispatchEvent(new Event('input', { bubbles: true }));
      }
      editor.setSelectionRange(nextStart, nextEnd, direction);
      editor.scrollTop = scrollTop;
      editor.scrollLeft = scrollLeft;
      scheduleCodeSave();
    }

    renderButton.addEventListener('click', () => render());
    windowButton.addEventListener('click', () => render(true));
    document.getElementById('format-code').addEventListener('click', formatEditor);
    editor.addEventListener('keydown', event => {
      if (event.isComposing) return;
      if (event.key === 'Tab' && !event.metaKey && !event.ctrlKey && !event.altKey) {
        event.preventDefault();
        indentEditor(event.shiftKey);
        return;
      }
      if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') {
        event.preventDefault();
        render();
      }
    });
  </script>
</body>
</html>
